<!DOCTYPE html>
<html>
<head>
<title>Chess Board Using Divs</title>

<style>

body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.board{
    width: 480px;
    height: 480px;
    display: flex;
    flex-wrap: wrap;
    border: 2px solid black;
}

.box{
    width: 60px;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.white{
    background-color: white;
}

.black{
    background-color: black;
}

img{
    width: 45px;
    background: white;
}

</style>
</head>

<body>
<div class="board">

<!-- Row 1 -->
<div class="box white"><img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg"></div>
<div class="box black"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg"></div>

<div class="box white"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg"></div>
